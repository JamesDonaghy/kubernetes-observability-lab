name: Validate Kubernetes manifests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Kubernetes YAML
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          entrypoint: /kubeconform
          args: >-
            -summary
            -output pretty
            -strict
            -ignore-missing-schemas
            kubernetes/
